name: vmPing Modern

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['modern/**', '.github/workflows/modern.yml']
  pull_request:
    paths: ['modern/**', '.github/workflows/modern.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Allow unprivileged ICMP
        run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
      - run: dotnet test modern/VmPing.Modern.slnx -c Release

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Optional code signing: base64 of a .pfx code-signing certificate and its password (repository secrets).
      SIGN_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Publish
        run: |
          for target in win-x64 linux-x64; do
            folder="$target"; [[ "$target" == "win-x64" ]] && folder="windows-x64"
            dotnet publish modern/src/VmPing.Desktop -c Release -r "$target" --self-contained true -p:PublishTrimmed=false -o "dist/$folder"
            mkdir -p "dist/$folder/notices"
            cp modern/notices/* "dist/$folder/notices/"
            cp LICENSE "dist/$folder/LICENSE.txt"
            cp modern/README.md "dist/$folder/README.md"
          done
          # Single-file executables for direct download (native libraries extracted on first run).
          for target in win-x64 linux-x64; do
            dotnet publish modern/src/VmPing.Desktop -c Release -r "$target" --self-contained true -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o "dist/single-$target"
          done
      - name: Sign Windows executables
        if: env.SIGN_PFX_BASE64 != ''
        run: |
          sudo apt-get install -y -qq osslsigncode
          echo "$SIGN_PFX_BASE64" | base64 -d > "$RUNNER_TEMP/cert.pfx"
          for exe in dist/windows-x64/vmPing-modern.exe dist/single-win-x64/vmPing-modern.exe; do
            osslsigncode sign -pkcs12 "$RUNNER_TEMP/cert.pfx" -pass "$SIGN_PFX_PASSWORD" -h sha256 \
              -n "vmPing Modern" -i "https://github.com/${{ github.repository }}" -t http://timestamp.digicert.com \
              -in "$exe" -out "$exe.signed"
            mv "$exe.signed" "$exe"
            osslsigncode verify -in "$exe" | grep -E "Signature verification|Signer"
          done
          rm -f "$RUNNER_TEMP/cert.pfx"
      - name: Package
        run: |
          (cd dist/windows-x64 && zip -qr ../vmPing-modern-windows-x64.zip .)
          tar -C dist/linux-x64 -czf dist/vmPing-modern-linux-x64.tar.gz .
          cp dist/single-win-x64/vmPing-modern.exe dist/vmPing-modern.exe
          cp dist/single-linux-x64/vmPing-modern dist/vmPing-modern-linux
          (cd dist && sha256sum vmPing-modern.exe vmPing-modern-linux vmPing-modern-*.zip vmPing-modern-*.tar.gz > SHA256SUMS.txt)
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/vmPing-modern.exe dist/vmPing-modern-linux \
            dist/vmPing-modern-windows-x64.zip dist/vmPing-modern-linux-x64.tar.gz dist/SHA256SUMS.txt \
            --title "vmPing Modern $GITHUB_REF_NAME" --generate-notes --latest
